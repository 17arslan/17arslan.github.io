<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kill the Dead — AMG</title>
<meta name="description" content="Kill the Dead, a mobile game by AMG (ArsMobileGames). Get it on the App Store and Google Play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0c;
    --bg-2: #171616;
    --accent: #9c1f1f;
    --accent-2: #c73a3a;
    --text: #e9e4dc;
    --muted: #8a8680;
    --rule: #2a2726;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(156,31,31,0.16), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6vh 24px;
  }
  .wrap{
    max-width: 460px;
    width:100%;
    text-align:center;
  }
  h1{
    font-family: 'Bebas Neue', sans-serif;
    font-weight:400;
    font-size: clamp(3rem, 12vw, 5.2rem);
    letter-spacing: 0.02em;
    line-height: 0.95;
    margin: 0 0 6px;
    color: var(--text);
  }
  h1 span{
    color: var(--accent-2);
  }
  .tagline{
    color: var(--muted);
    font-size: 1rem;
    margin: 0 0 40px;
    letter-spacing: 0.01em;
  }
  .rule{
    width: 56px;
    height: 3px;
    background: var(--accent);
    margin: 0 auto 40px;
    border: none;
  }
  .stores{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom: 8px;
  }
  .store-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding: 14px 20px;
    border-radius: 10px;
    border: 1px solid var(--rule);
    background: var(--bg-2);
    color: var(--text);
    text-decoration:none;
    font-weight:500;
    font-size: 0.98rem;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .store-btn:hover{
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .store-btn .mark{
    font-size: 1.2rem;
    line-height:1;
  }
  .store-btn small{
    display:block;
    color: var(--muted);
    font-weight:400;
    font-size: 0.75rem;
    margin-top:2px;
  }
  footer{
    text-align:center;
    padding: 28px 24px 32px;
    border-top: 1px solid var(--rule);
  }
  .contact{
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 10px;
  }
  .contact a{
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
  }
  .contact a:hover{
    border-bottom-color: var(--accent-2);
  }
  .legal{
    color: var(--muted);
    font-size: 0.8rem;
    margin:0;
  }
  .legal a{
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .legal a:hover{ color: var(--text); }
</style>
</head>
<body>
  <main>
    <div class="wrap">
      <h1>KILL THE <span>DEAD</span></h1>
      <p class="tagline">Survive the outbreak. One shot at a time.</p>
      <hr class="rule">
      <div class="stores">
        <a class="store-btn" href="#" id="apple-link">
          <span class="mark">&#63743;</span>
          <span>
            Download on the App Store
          </span>
        </a>
        <a class="store-btn" href="#" id="google-link">
          <span class="mark">&#9654;</span>
          <span>
            Get it on Google Play
          </span>
        </a>
      </div>
    </div>
  </main>
  <footer>
    <p class="contact">Questions? Write us at <a href="mailto:virnvirn17@gmail.com">virnvirn17@gmail.com</a></p>
    <p class="legal">&copy; 2026 AMG — ArsMobileGames</p>
    <p class="legal"><a href="PrivacyPolicy.html">Privacy Policy</a></p>
  </footer>
</body>
</html>
